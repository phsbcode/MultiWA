name: Publish Docker Images

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  GHCR_REGISTRY: ghcr.io
  DOCKERHUB_NAMESPACE: ribato
  IMAGE_PREFIX: multiwa

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build & Push — ${{ matrix.service }}
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    strategy:
      matrix:
        include:
          - service: api
            dockerfile: docker/Dockerfile.api
            build-args: ""
          - service: admin
            dockerfile: docker/Dockerfile.admin
            build-args: NEXT_PUBLIC_API_URL=http://localhost:3333

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -- Login to GitHub Container Registry --
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -- Login to Docker Hub --
      - name: Log in to Docker Hub
        id: docker-hub-login
        uses: docker/login-action@v3
        if: github.event_name != 'pull_request' && env.DOCKERHUB_TOKEN != ''
        continue-on-error: true
        with:
          username: ${{ env.DOCKERHUB_NAMESPACE }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      # -- Build metadata (tags for both registries) --
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
            ${{ steps.docker-hub-login.outcome == 'success' && format('{0}/{1}-{2}', env.DOCKERHUB_NAMESPACE, env.IMAGE_PREFIX, matrix.service) || '' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      # -- Build and push Docker image --
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ${{ matrix.build-args }}
